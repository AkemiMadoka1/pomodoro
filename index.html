<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>
        番茄钟
    </title>
</head>

<body>
    <p id="time">
        25:00
    </p>
    <script>
        start_time = 0;
        interval_state = null;
        total = 25*60;
        function update_time()
        {
            now_time = Date.now()
            time = document.getElementById("time");
            delta_time = (now_time - start_time)/1000;
            now_time = total - delta_time
            if (now_time<=0)
        {
            clearInterval(interval_state)
            now_time = 0;
            start_time = 0;
            interval_state = null;
        }
            now_minutes = Math.floor(now_time/60)
            now_seconds = now_time-now_minutes*60
            time.textContent = String(now_minutes).padStart(2,"0") + ":" + String(Math.floor(now_seconds)).padStart(2,"0")
        }
        function clock()
        {
            if (!interval_state)
            {
                start_time = Date.now()
                interval_state =  setInterval(update_time,500);
            }
        }
    </script>
    <button type="button" onclick="clock()">
        开始
    </button>
</body>
</html>
